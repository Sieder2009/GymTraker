<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="3 Gewinnt, 4 Gewinnt und Blackjack." />
  <meta name="theme-color" content="#0a0b12" />
  <title>Sieder Hub // Spiele</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="blobs" aria-hidden="true">
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="blob b3"></div>
  </div>

  <header class="site-header">
    <div class="header-inner">
      <a class="logo" href="index.html">Sieder<span>Hub</span></a>
      <button class="nav-toggle" id="navToggle" type="button" aria-expanded="false" aria-controls="siteNav">
        <span></span><span></span><span></span>
        <span class="sr-only">Menü</span>
      </button>
      <nav class="site-nav" id="siteNav">
        <a href="index.html">Übersicht</a>
        <a href="spiele.html" class="active">Spiele</a>
        <a href="info.html">Info</a>
        <a href="medien.html">Medien</a>
        <a href="archiv/index.html">Archiv</a>
        <a href="../index.html" class="nav-cta">GymTraker →</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="page-title">
      <h1>Spiele</h1>
      <p>Kurze Pause gefällig?</p>
    </div>

    <div class="panel">
      <div class="panel-header">
        <h2>Spieleauswahl</h2>
        <div class="panel-dots"><span></span><span></span><span></span></div>
      </div>

      <div class="panel-body">
        <div class="game-selection">
          <button class="game-card" type="button" data-game="tictactoe">
            <h3>3 Gewinnt</h3>
            <p>Klassisches Tic-Tac-Toe</p>
            <div class="game-preview">X | O | X<br />-----------<br />O | X | O<br />-----------<br />X | O | X</div>
          </button>

          <button class="game-card" type="button" data-game="connectfour">
            <h3>4 Gewinnt</h3>
            <p>Connect Four Spiel</p>
            <div class="game-preview">|O| | | | | |<br />|X|O| | | | |<br />|X|X|O| | | |<br />|X|X|X|O| | |</div>
          </button>

          <button class="game-card" type="button" data-game="blackjack">
            <h3>Blackjack</h3>
            <p>Kartenglücksspiel</p>
            <div class="game-preview">&spades;A &hearts;K<br />&clubs;7 &diams;Q<br />BJ:21</div>
          </button>
        </div>

        <div id="game-container">
          <div class="welcome-message">
            <p>Wähle oben ein Spiel aus.</p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <div>© 2026 Sieder Hub · <span id="clock"></span></div>
    <div class="foot-links">
      <a href="index.html">Übersicht</a>
      <a href="spiele.html">Spiele</a>
      <a href="info.html">Info</a>
      <a href="medien.html">Medien</a>
      <a href="archiv/index.html">Archiv</a>
      <a href="../index.html">GymTraker</a>
    </div>
  </footer>

  <template id="tictactoe-template">
    <div class="game-area">
      <h2>3 Gewinnt</h2>
      <div class="player-info">
        <span id="ttt-player">Aktueller Spieler: X</span>
        <span id="ttt-status">Status: läuft</span>
      </div>
      <div class="ttt-grid">
        <div class="cell" data-index="0"></div>
        <div class="cell" data-index="1"></div>
        <div class="cell" data-index="2"></div>
        <div class="cell" data-index="3"></div>
        <div class="cell" data-index="4"></div>
        <div class="cell" data-index="5"></div>
        <div class="cell" data-index="6"></div>
        <div class="cell" data-index="7"></div>
        <div class="cell" data-index="8"></div>
      </div>
      <button class="game-btn" type="button" id="ttt-reset">Neues Spiel</button>
    </div>
  </template>

  <template id="connectfour-template">
    <div class="game-area">
      <h2>4 Gewinnt</h2>
      <div class="player-info">
        <span id="cf-player">Aktueller Spieler: Rot</span>
        <span id="cf-status">Status: läuft</span>
      </div>
      <div class="cf-grid"></div>
      <button class="game-btn" type="button" id="cf-reset">Neues Spiel</button>
    </div>
  </template>

  <template id="blackjack-template">
    <div class="game-area">
      <h2>Blackjack</h2>
      <div class="player-info">
        <span id="bj-status">Credits: 100</span>
        <span id="bj-score">Einsatz: 10</span>
      </div>
      <div class="cards-area">
        <div class="dealer-cards">
          <h3>Dealer</h3>
          <div id="dealer-hand"></div>
          <div id="dealer-score"></div>
        </div>
        <div class="player-cards">
          <h3>Spieler</h3>
          <div id="player-hand"></div>
          <div id="player-score"></div>
        </div>
      </div>
      <p class="bj-message" id="bj-message" role="status"></p>
      <div class="bj-controls">
        <button class="game-btn" type="button" id="hit-btn">Hit</button>
        <button class="game-btn" type="button" id="stand-btn">Stand</button>
        <button class="game-btn" type="button" id="newgame-btn">Neues Spiel</button>
      </div>
    </div>
  </template>

  <script src="app.js"></script>
  <script src="games.js"></script>
</body>
</html>
