name: ironpeak_mobile
description: >
  Ironpeak Fitness — Trainingsplan, Kraft-Fortschritt (Bench/Deadlift/Squat)
  und Muskelgruppen-Balance, komplett lokal auf dem Gerät gespeichert.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.2
  sqflite: ^2.4.1
  sqflite_common_ffi: ^2.3.4
  path: ^1.9.0
  path_provider: ^2.1.4
  image_picker: ^1.2.3
  health: ^13.3.1
  intl: ^0.20.2
  google_fonts: ^6.2.1
  flutter_dotenv: ^6.0.1
  package_info_plus: ^9.0.1
  http: ^1.6.0
  url_launcher: ^6.3.2
  fl_chart: ^0.69.2
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  flutter_timezone: ^3.0.1
  path_drawing: ^1.0.1
  share_plus: ^10.1.4
  file_picker: ^8.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - .env
    - assets/exercises.json
