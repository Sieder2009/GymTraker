name: ironpeak_mobile
description: >
  Ironpeak Fitness — Trainingsplan, Kraft-Fortschritt (Bench/Deadlift/Squat)
  und Muskelgruppen-Balance, komplett lokal auf dem Gerät gespeichert.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  intl: ^0.19.0
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
