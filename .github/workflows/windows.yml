name: Build Windows App

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch: {} # lets us test a fix on demand without cutting a release tag

permissions:
  contents: write

# Shared across all four platform workflows on purpose -- see android.yml's
# comment on this same block for why.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      - run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - run: flutter test

      # Release builds get their version from the tag that triggered them
      # (v1.2.3 -> 1.2.3), not pubspec.yaml's version: field -- so cutting a
      # release is just "push a tag", nothing to hand-edit first. A manual
      # workflow_dispatch run (no tag) falls back to whatever pubspec.yaml
      # already has, since that's just a test build. windows-latest ships
      # Git Bash, so `shell: bash` here works the same as on the other
      # platforms' workflows instead of needing separate pwsh syntax.
      - name: Build Windows app
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            flutter build windows --release --build-name="${GITHUB_REF_NAME#v}"
          else
            flutter build windows --release
          fi
        shell: bash

      # Ship the whole Release folder, not just the .exe — it needs its
      # sibling DLLs (flutter_windows.dll, plugin .dlls) and data/ folder
      # alongside it to actually run. Kept as a portable, no-install option
      # alongside the real installer built below — UpdateProvider only
      # ever auto-downloads the setup .exe (see
      # UpdateCheckResult.assetForThisPlatform), not this zip.
      - name: Package Windows build (portable zip)
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath build\windows\x64\runner\ironpeak-fitness-windows.zip
        shell: pwsh

      # A real installer, not just a zip someone has to manually unpack —
      # see windows/installer/installer.iss for why (in short: it's what
      # lets "tap Install" in the app actually replace a running copy and
      # relaunch it, instead of opening a zip in Explorer and doing
      # nothing). Inno Setup 6 ships preinstalled on windows-latest
      # runners; iscc's directory is added to PATH by the runner image, so
      # no separate install step is needed here. Version is passed through
      # explicitly so the installer's own version always matches the
      # binary it's packaging (tag-derived on a release, pubspec.yaml's
      # version on a manual workflow_dispatch test build), same source
      # windows-app's own --build-name already uses above.
      # PowerShell, not bash: Git Bash's MSYS runtime auto-converts any
      # argument starting with "/" (like /DMyAppVersion=...) before handing
      # it to a native .exe, mangling the switch enough that iscc thinks
      # it received a second script filename (MSYS_NO_PATHCONV=1 was tried
      # first and didn't stop it). pwsh invokes native executables without
      # that POSIX-path translation layer at all, so the switch reaches
      # iscc unmodified -- same reasoning as the zip step above already
      # using pwsh.
      - name: Build Windows installer (Inno Setup)
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $VERSION = "${{ github.ref_name }}".Substring(1)
          } else {
            $line = (Get-Content pubspec.yaml | Select-String '^version:').Line
            $VERSION = ($line -replace 'version:\s*', '').Split('+')[0]
          }
          iscc "/DMyAppVersion=$VERSION" windows/installer/installer.iss
        shell: pwsh

      - uses: actions/upload-artifact@v4
        with:
          name: ironpeak-fitness-windows
          path: |
            mobile/build/windows/x64/runner/ironpeak-fitness-windows.zip
            mobile/build/windows/x64/runner/ironpeak-fitness-windows-setup.exe

      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            mobile/build/windows/x64/runner/ironpeak-fitness-windows.zip
            mobile/build/windows/x64/runner/ironpeak-fitness-windows-setup.exe
          generate_release_notes: true
