name: Build Android APK

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch: {} # lets us test a fix on demand without cutting a release tag

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      # android/ IS committed now (unlike before) — Health Connect needs
      # persistent permissions in AndroidManifest.xml and a minSdk bump,
      # which a fresh `flutter create` on every run would silently wipe.
      - run: flutter pub get

      - run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - run: flutter test

      # Release builds get their version from the tag that triggered them
      # (v1.2.3 -> 1.2.3), not pubspec.yaml's version: field -- so cutting a
      # release is just "push a tag", nothing to hand-edit first. A manual
      # workflow_dispatch run (no tag) falls back to whatever pubspec.yaml
      # already has, since that's just a test build.
      - name: Build APK
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            flutter build apk --release --build-name="${GITHUB_REF_NAME#v}"
          else
            flutter build apk --release
          fi
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: ironpeak-fitness-android
          path: mobile/build/app/outputs/flutter-apk/app-release.apk

      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: mobile/build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
