name: Build Android APK

on:
  push:
    branches:
      - master
    tags:
      - 'v*.*.*'
    paths:
      - 'mobile/**'
      - '.github/workflows/android.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      # android/ isn't committed (nothing here has ever been built locally) —
      # generated fresh each run against whatever Flutter version CI installs.
      - run: flutter create --org com.ironpeak --platforms=android .

      - run: flutter pub get

      - run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - run: flutter test

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: ironpeak-fitness-android
          path: mobile/build/app/outputs/flutter-apk/app-release.apk

      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: mobile/build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
